name: CI

on:
  # NOTE:
  # 지금은 PR 없이 작업하므로 모든 브랜치의 push에서 CI를 실행한다.
  # [ PR 방식으로 작업하게 되면 `branches: [master]`로 좁힐 것. ]
  # 그대로 두면 PR 브랜치에 push할 때 push/pull_request가 각각 실행돼 CI가 두 번 돈다.
  push:
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

# 같은 브랜치에 연달아 push하면 이전 실행을 취소하고 최신 커밋만 검사한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run check (Spotless, lint, unit tests)
        run: ./gradlew check --console=plain
